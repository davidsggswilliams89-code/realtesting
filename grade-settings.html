<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Settings - GGCHST SMS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
header{background:#0b5d3b;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;opacity:.9;font-size:13px}
.container{max-width:1150px;margin:20px auto;padding:0 15px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.card h2{margin:0 0 15px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px;background:#fff}
textarea{min-height:75px;resize:vertical}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:bold}
.primary{background:#0b5d3b;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#b91c1c;color:#fff}
.small{padding:7px 10px;font-size:12px}
.notice{padding:10px 12px;border-radius:7px;background:#eef6f1;color:#0b5d3b;margin-bottom:15px;font-size:13px}
.error{background:#fff0f0;color:#a11}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{max-width:260px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#f8fafc}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.active{background:#dcfce7;color:#166534}
.inactive{background:#fee2e2;color:#991b1b}
.pass{background:#dbeafe;color:#1e40af}
.fail{background:#fee2e2;color:#991b1b}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}
.help{font-size:12px;color:#6b7280;margin-top:5px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<header>
  <h1>Grade Settings / Grading System</h1>
  <p>Green Garden College of Health Sciences &amp; Technology (GGCHST)</p>
</header>

<div class="container">
  <div id="firebaseStatus" class="notice">Connecting to Firebase...</div>

  <div class="card">
    <h2 id="formTitle">Add Grade</h2>
    <form id="gradeForm">
      <div class="grid">
        <div class="field">
          <label>Grade *</label>
          <input id="grade" required maxlength="5" placeholder="e.g. A">
        </div>
        <div class="field">
          <label>Minimum Score *</label>
          <input id="minimumScore" type="number" min="0" max="100" step="0.01" required>
        </div>
        <div class="field">
          <label>Maximum Score *</label>
          <input id="maximumScore" type="number" min="0" max="100" step="0.01" required>
        </div>
        <div class="field">
          <label>Grade Point *</label>
          <input id="gradePoint" type="number" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label>Result Type *</label>
          <select id="resultType">
            <option value="Pass">Pass</option>
            <option value="Fail">Fail</option>
          </select>
        </div>
        <div class="field">
          <label>Status *</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea id="description" placeholder="Optional description"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">Save Grade</button>
        <button class="secondary" type="button" id="cancelBtn" style="display:none">Cancel Edit</button>
      </div>
    </form>
    <div class="help">Score ranges are inclusive. The system prevents overlapping active grading ranges.</div>
  </div>

  <div class="card">
    <h2>Grade Scale</h2>
    <div class="toolbar">
      <input id="search" placeholder="Search grade...">
      <select id="filterStatus">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
      <select id="filterResultType">
        <option value="">All Result Types</option>
        <option value="Pass">Pass</option>
        <option value="Fail">Fail</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Grade</th><th>Min</th><th>Max</th><th>Grade Point</th>
            <th>Result</th><th>Status</th><th>Description</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="gradeTable">
          <tr><td colspan="8">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, serverTimestamp, getDocs
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyAoT3LGcdw3A0FzHDrPEuhTNCnfiTklGXY",
  authDomain:"ggchst-sms-new.firebaseapp.com",
  projectId:"ggchst-sms-new",
  storageBucket:"ggchst-sms-new.firebasestorage.app",
  messagingSenderId:"942770190211",
  appId:"1:942770190211:web:aa9a085a38aaa517b368b6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const ref=collection(db,"gradeSettings");

const form=document.getElementById("gradeForm");
const table=document.getElementById("gradeTable");
const statusBox=document.getElementById("firebaseStatus");
let records=[];
let editingId=null;

const $=id=>document.getElementById(id);
const num=id=>Number($(id).value);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function normalize(d){
  return {
    id:d.id,
    grade:String(d.grade??"").trim().toUpperCase(),
    minimumScore:Number(d.minimumScore??0),
    maximumScore:Number(d.maximumScore??0),
    gradePoint:Number(d.gradePoint??0),
    resultType:d.resultType||"Pass",
    status:d.status||"Active",
    description:d.description||""
  };
}
function rangesOverlap(a,b){
  return a.minimumScore<=b.maximumScore && b.minimumScore<=a.maximumScore;
}
async function validateGrade(item, ignoreId=null){
  if(!item.grade) return "Grade is required.";
  if(item.minimumScore<0 || item.maximumScore>100) return "Scores must be between 0 and 100.";
  if(item.minimumScore>item.maximumScore) return "Minimum score cannot be greater than maximum score.";
  if(item.gradePoint<0) return "Grade point cannot be negative.";

  const snap=await getDocs(ref);
  const all=snap.docs.map(x=>normalize({...x.data(),id:x.id}));
  const sameGrade=all.find(x=>x.id!==ignoreId && x.grade===item.grade);
  if(sameGrade) return "This grade already exists.";

  if(item.status==="Active"){
    const overlap=all.find(x=>x.id!==ignoreId && x.status==="Active" && rangesOverlap(item,x));
    if(overlap) return `Score range overlaps with grade ${overlap.grade} (${overlap.minimumScore}-${overlap.maximumScore}).`;
  }
  return "";
}

function resetForm(){
  form.reset();
  $("resultType").value="Pass";
  $("status").value="Active";
  $("formTitle").textContent="Add Grade";
  $("cancelBtn").style.display="none";
  editingId=null;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const item={
      grade:$("grade").value.trim().toUpperCase(),
      minimumScore:num("minimumScore"),
      maximumScore:num("maximumScore"),
      gradePoint:num("gradePoint"),
      resultType:$("resultType").value,
      status:$("status").value,
      description:$("description").value.trim()
    };
    const error=await validateGrade(item,editingId);
    if(error){alert(error);return;}

    if(editingId){
      await updateDoc(doc(db,"gradeSettings",editingId),{
        ...item,updatedAt:serverTimestamp()
      });
      alert("Grade updated successfully.");
    }else{
      await addDoc(ref,{...item,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      alert("Grade added successfully.");
    }
    resetForm();
  }catch(err){
    console.error(err);
    alert("Could not save grade: "+err.message);
  }
});

$("cancelBtn").onclick=resetForm;

window.editGrade=id=>{
  const r=records.find(x=>x.id===id);
  if(!r)return;
  editingId=id;
  $("grade").value=r.grade;
  $("minimumScore").value=r.minimumScore;
  $("maximumScore").value=r.maximumScore;
  $("gradePoint").value=r.gradePoint;
  $("resultType").value=r.resultType;
  $("status").value=r.status;
  $("description").value=r.description;
  $("formTitle").textContent="Edit Grade";
  $("cancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.deleteGrade=async id=>{
  const r=records.find(x=>x.id===id);
  if(!r)return;
  if(!confirm(`Delete grade ${r.grade}?`))return;
  try{
    await deleteDoc(doc(db,"gradeSettings",id));
  }catch(err){
    alert("Could not delete grade: "+err.message);
  }
};

function render(){
  const q=$("search").value.trim().toLowerCase();
  const fs=$("filterStatus").value;
  const fr=$("filterResultType").value;

  const list=records
    .filter(r=>
      (!q || r.grade.toLowerCase().includes(q) || r.description.toLowerCase().includes(q)) &&
      (!fs || r.status===fs) &&
      (!fr || r.resultType===fr)
    )
    .sort((a,b)=>b.minimumScore-a.minimumScore);

  if(!list.length){
    table.innerHTML='<tr><td colspan="8">No grade settings found.</td></tr>';
    return;
  }

  table.innerHTML=list.map(r=>`
    <tr>
      <td><strong>${esc(r.grade)}</strong></td>
      <td>${r.minimumScore}</td>
      <td>${r.maximumScore}</td>
      <td>${r.gradePoint}</td>
      <td><span class="badge ${r.resultType==="Pass"?"pass":"fail"}">${esc(r.resultType)}</span></td>
      <td><span class="badge ${r.status==="Active"?"active":"inactive"}">${esc(r.status)}</span></td>
      <td>${esc(r.description)}</td>
      <td class="actions-cell">
        <button class="secondary small" onclick="editGrade('${r.id}')">Edit</button>
        <button class="danger small" onclick="deleteGrade('${r.id}')">Delete</button>
      </td>
    </tr>
  `).join("");
}

["search","filterStatus","filterResultType"].forEach(id=>$(id).addEventListener("input",render));
["filterStatus","filterResultType"].forEach(id=>$(id).addEventListener("change",render));

onSnapshot(ref,snap=>{
  records=snap.docs.map(d=>normalize({...d.data(),id:d.id}));
  render();
  statusBox.textContent=`Firebase connected • ${records.length} grade setting(s) loaded.`;
},err=>{
  console.error(err);
  statusBox.textContent="Firebase error: "+err.message;
  statusBox.classList.add("error");
});

window.addEventListener("error",e=>{
  statusBox.textContent="Page error: "+e.message;
  statusBox.classList.add("error");
});
window.addEventListener("unhandledrejection",e=>{
  statusBox.textContent="Page error: "+(e.reason?.message||e.reason);
  statusBox.classList.add("error");
});
</script>
</body>
</html>
