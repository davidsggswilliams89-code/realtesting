<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Login | GGCHST SMS</title>
<style>
:root{
  --green:#0f8b4c;
  --green-dark:#08733d;
  --green-light:#e8f8ef;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --bg:#f5f8f7;
  --white:#fff;
  --danger:#b42318;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f7fbf9 0%,#eef5f2 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-wrap{width:100%;max-width:430px}
.brand{text-align:center;margin-bottom:20px}
.logo{
  width:82px;height:82px;border-radius:50%;
  background:var(--green-light);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
  border:1px solid #cceedd;
  overflow:hidden;
}
.logo span{font-size:42px}
.brand h1{margin:0;font-size:27px}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  box-shadow:0 12px 35px rgba(15,23,42,.08);
}
.card h2{margin:0 0 6px;font-size:23px}
.subtitle{margin:0 0 24px;color:var(--muted);font-size:14px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{
  width:100%;
  padding:14px 15px;
  border:1px solid #d8dee3;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:#fff;
}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,139,76,.1)}
.password-row{position:relative}
.password-row input{padding-right:78px}
.show-btn{
  position:absolute;right:8px;top:7px;
  border:0;background:transparent;color:var(--green);
  font-weight:700;cursor:pointer;padding:7px;
}
.login-btn{
  width:100%;border:0;border-radius:10px;
  padding:14px 16px;background:var(--green);color:white;
  font-size:15px;font-weight:700;cursor:pointer;
}
.login-btn:hover{background:var(--green-dark)}
.login-btn:disabled{opacity:.65;cursor:not-allowed}
.status{
  display:none;margin:0 0 16px;padding:11px 12px;
  border-radius:9px;font-size:13px;line-height:1.45;
}
.status.error{display:block;background:#fff1f0;color:var(--danger);border:1px solid #ffd4d0}
.status.success{display:block;background:#edf9f2;color:#08733d;border:1px solid #cceedd}
.help{
  margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5
}
.back{
  display:block;text-align:center;margin-top:18px;
  color:var(--green);text-decoration:none;font-size:13px;font-weight:700
}
.spinner{
  display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.5);
  border-top-color:#fff;border-radius:50%;vertical-align:-3px;
  margin-right:7px;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){
  body{padding:14px}
  .card{padding:22px 18px;border-radius:16px}
  .brand h1{font-size:24px}
}
</style>
</head>
<body>
<main class="login-wrap">
  <div class="brand">
    <div class="logo"><span>🎓</span></div>
    <h1>GGCHST SMS</h1>
    <p>Green Garden College of Health Sciences &amp; Technology</p>
  </div>

  <section class="card">
    <h2>Lecturer Login</h2>
    <p class="subtitle">Sign in with the lecturer account created for you.</p>

    <div id="status" class="status"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="username" placeholder="lecturer@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="show-btn" id="showPassword">Show</button>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" type="submit">Login</button>
    </form>

    <div class="help">
      Your Firebase Authentication email must match the email saved in the Registrar's lecturer profile.
    </div>
    <a class="back" href="index.html">← Back to Portal</a>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAoT3LGcdw3A0FzHDrPEuhTNCnfiTklGXY",
  authDomain: "ggchst-sms-new.firebaseapp.com",
  projectId: "ggchst-sms-new",
  storageBucket: "ggchst-sms-new.firebasestorage.app",
  messagingSenderId: "942770190211",
  appId: "1:942770190211:web:aa9a085a38aaa517b368b6"
};

const statusEl = document.getElementById("status");
const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const passwordEl = document.getElementById("password");

function showStatus(message, type="error"){
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}

function friendlyAuthError(code){
  const map = {
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/invalid-login-credentials":"Incorrect email or password.",
    "auth/user-not-found":"No Firebase Authentication account exists for this email.",
    "auth/wrong-password":"Incorrect email or password.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/too-many-requests":"Too many login attempts. Please wait and try again.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    "auth/user-disabled":"This lecturer account has been disabled."
  };
  return map[code] || ("Login failed: " + code);
}

try{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(async user=>{
    if(!user) return;

    // Already signed in: verify that this Firebase account belongs
    // to a lecturer record created by the Registrar.
    try{
      const email = (user.email || "").trim().toLowerCase();
      const snap = await db.collection("lecturers").where("email","==",email).limit(1).get();

      if(snap.empty){
        await auth.signOut();
        showStatus("This Firebase account is not linked to a lecturer profile in the Registrar records.");
        return;
      }

      const doc = snap.docs[0];
      const lecturer = {id:doc.id, ...doc.data()};

      localStorage.setItem("ggchstLecturerAuthUid", user.uid);
      localStorage.setItem("ggchstSelectedLecturerId", lecturer.id);
      localStorage.setItem("ggchstSelectedLecturerStaffId", lecturer.staffId || "");
      localStorage.setItem("ggchstSelectedLecturerName", lecturer.name || "");
      localStorage.setItem("ggchstSelectedLecturerEmail", email);

      showStatus("Login successful. Opening lecturer portal...", "success");
      setTimeout(()=>location.href="lecturer-profile.html",350);
    }catch(err){
      console.error(err);
      showStatus("Login succeeded, but the lecturer record could not be verified. Check Firestore access.");
    }
  });

  form.addEventListener("submit", async e=>{
    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = passwordEl.value;

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span>Signing in...';
    showStatus("Checking your lecturer account...", "success");

    try{
      await auth.signInWithEmailAndPassword(email,password);
    }catch(err){
      console.error(err);
      showStatus(friendlyAuthError(err.code));
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });

  document.getElementById("showPassword").onclick=()=>{
    const isPassword=passwordEl.type==="password";
    passwordEl.type=isPassword?"text":"password";
    document.getElementById("showPassword").textContent=isPassword?"Hide":"Show";
  };
}catch(err){
  console.error(err);
  showStatus("Firebase could not be initialized. Check the Firebase configuration and internet connection.");
}
</script>
</body>
</html>
