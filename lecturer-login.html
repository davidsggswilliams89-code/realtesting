<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GGCHST SMS | Lecturer Login</title><style>:root{--p:#15803D;--d:#14532D;--bg:#F6F8FA;--b:#E5E7EB;--m:#667085;--s:#ECFDF3;--danger:#B42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f0fdf4,#f6f8fa);font-family:Arial,Helvetica,sans-serif;color:#243042}.card{width:min(430px,100%);background:#fff;border:1px solid var(--b);border-radius:18px;padding:26px;box-shadow:0 15px 45px #102a2a12}.logo{width:64px;height:64px;margin:0 auto 14px;display:block;object-fit:contain}h1{margin:0;text-align:center;font-size:24px;color:var(--d)}.sub{text-align:center;color:var(--m);font-size:12px;line-height:1.5;margin:7px 0 22px}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid var(--b);border-radius:9px;font:inherit;outline:none}input:focus{border-color:#22C55E;box-shadow:0 0 0 3px #22c55e18}button{width:100%;margin-top:16px;border:0;border-radius:9px;padding:12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:12px;line-height:1.45}.error{display:block;background:#fef3f2;color:var(--danger);border:1px solid #fecdca}.info{display:block;background:var(--s);color:#166534;border:1px solid #bbf7d0}.back{display:block;text-align:center;margin-top:15px;color:var(--p);font-size:12px;font-weight:700;text-decoration:none}</style></head><body><div class="card"><img class="logo" src="https://ggchstgusau.edu.ng/_next/image?q=75&url=%2Flogo.png&w=384" alt="GGCHST"><h1>Lecturer Login</h1><div class="sub">Sign in with your Firebase Authentication email and password.</div><form id="loginForm"><label for="email">Email Address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">Sign In</button><div id="msg" class="msg"></div></form><a class="back" href="index.html">← Back to GGCHST Portal</a></div><script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,setPersistence,browserLocalPersistence,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAoT3LGcdw3A0FzHDrPEuhTNCnfiTklGXY",authDomain:"ggchst-sms-new.firebaseapp.com",projectId:"ggchst-sms-new",storageBucket:"ggchst-sms-new.firebasestorage.app",messagingSenderId:"942770190211",appId:"1:942770190211:web:aa9a085a38aaa517b368b6"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); const ready=setPersistence(auth,browserLocalPersistence); const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg'),email=document.getElementById('email');
function message(t,e=false){msg.textContent=t;msg.className='msg '+(e?'error':'info')}
function match(rows,u){const uid=u?.uid||'',em=(u?.email||'').trim().toLowerCase();return rows.find(x=>String(x.authUid||x.firebaseUid||x.uid||'')===uid)||rows.find(x=>String(x.email||x.emailAddress||x.lecturerEmail||'').trim().toLowerCase()===em)}
onAuthStateChanged(auth,async u=>{await ready;if(!u)return;try{const snap=await getDocs(collection(db,'lecturers'));const rows=snap.docs.map(d=>({id:d.id,...d.data()}));const row=match(rows,u);if(!row){await signOut(auth);message('Firebase login succeeded, but this email is not linked to a lecturer record. Ask Registrar/Admin to use the same email.',true);btn.disabled=false;btn.textContent='Sign In';return}try{await updateDoc(doc(db,'lecturers',row.id),{authUid:u.uid,authEmail:u.email||'',authLinkedAt:serverTimestamp()})}catch(e){console.warn('Could not back-fill authUid:',e)}localStorage.setItem('ggchstSelectedLecturerId',row.id);localStorage.setItem('ggchstSelectedLecturerStaffId',row.staffId||'');localStorage.setItem('ggchstSelectedLecturerName',row.name||row.fullName||'');message('Login successful. Opening lecturer profile…');location.replace('lecturer-profile.html')}catch(e){console.error(e);message('Could not verify lecturer profile: '+(e.code||e.message),true);btn.disabled=false;btn.textContent='Sign In'}});
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.className='msg';try{await ready;await signInWithEmailAndPassword(auth,email.value.trim(),document.getElementById('password').value)}catch(e){const m={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No Firebase Authentication account exists for this email.','auth/wrong-password':'Incorrect email or password.','auth/too-many-requests':'Too many attempts. Please try again later.','auth/network-request-failed':'Network error. Check your internet connection.'};message(m[e.code]||e.message||'Login failed.',true);btn.disabled=false;btn.textContent='Sign In'}});
</script></body></html>
