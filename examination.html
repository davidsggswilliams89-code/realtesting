<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Examination Management | GGCHST SMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}header{background:#0b5d3b;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}.header-inner{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;margin:0 0 5px}.subtitle{font-size:13px;opacity:.9}.container{max-width:1400px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.07);margin-bottom:20px}.card h2{margin:0 0 16px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #ccd5df;border-radius:9px;background:#fff;font-size:14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#0b5d3b;box-shadow:0 0 0 2px rgba(11,93,59,.1)}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.span2{grid-column:span 2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.primary{background:#0b5d3b;color:#fff}.secondary{background:#e9eef3;color:#172033}.danger{background:#b42318;color:#fff}.small{padding:7px 10px;font-size:12px}.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.status-scheduled{background:#e6f0ff;color:#1756a3}.status-active{background:#d9f5e5;color:#087443}.status-canceled{background:#fde4e4;color:#9b1c1c}.status-postponed{background:#fff0c2;color:#795b00}.status-finished{background:#e9e1ff;color:#5d3a9b}.status-draft{background:#eceff2;color:#59636e}.notice{padding:11px 13px;border-radius:9px;margin-bottom:14px;display:none;font-size:13px}.notice.success{background:#e0f7e9;color:#096b3b}.notice.error{background:#fde4e4;color:#9b1c1c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px 9px;border-bottom:1px solid #e7ebef;text-align:left;font-size:12px;vertical-align:middle}th{background:#f7f9fb;position:sticky;top:0;z-index:1}.toolbar{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:15px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccd5df;border-radius:8px}.empty{text-align:center;padding:30px;color:#697586}.help{font-size:11px;color:#6b7280}.linkbox{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{grid-template-columns:1fr}header{position:static}}
</style></head><body>
<header><div class="header-inner"><div><h1>Examination Management</h1><div class="subtitle">GGCHST School Management System • Examination periods and sessions</div></div><a class="btn secondary" href="admin-fixed.html">← Admin</a></div></header>
<main class="container"><div id="notice" class="notice"></div>
<section class="card"><div class="linkbox"><a class="btn primary" href="examination-schedule.html">Open Examination Schedule →</a></div><h2 id="formTitle">Create Examination</h2><form id="examForm"><div class="grid">
<div class="field"><label>Academic Session *</label><select id="session" required><option value="">Select session</option></select></div>
<div class="field"><label>Semester *</label><select id="semester" required disabled><option value="">Select semester</option></select></div>
<div class="field span2"><label>Examination Name *</label><input id="name" required placeholder="e.g. First Semester Examination"></div>
<div class="field"><label>Examination Type *</label><select id="type" required><option value="">Select type</option><option>Regular</option><option>Resit</option><option>Make-up</option></select></div>
<div class="field"><label>Start Date *</label><input id="startDate" type="date" required></div>
<div class="field"><label>End Date *</label><input id="endDate" type="date" required></div>
<div class="field"><label>Status *</label><select id="status" required><option>Draft</option><option>Scheduled</option><option>Active</option><option>Canceled</option><option>Postponed</option><option>Finished</option></select></div>
<div class="field full"><label>Notes / Instructions</label><textarea id="notes" placeholder="Optional examination notes or instructions"></textarea></div></div>
<div class="actions"><button type="submit" class="primary">Save Examination</button><button type="button" class="secondary" id="cancelEdit" style="display:none">Cancel Edit</button></div></form></section>
<section class="card"><h2>Examinations</h2><div class="toolbar"><input id="search" type="search" placeholder="Search examination, session, semester, type..."><select id="filterSession"><option value="">All sessions</option></select><select id="filterSemester"><option value="">All semesters</option></select><select id="filterStatus"><option value="">All status</option><option>Draft</option><option>Scheduled</option><option>Active</option><option>Canceled</option><option>Postponed</option><option>Finished</option></select></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Examination</th><th>Session</th><th>Semester</th><th>Type</th><th>Date Range</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tableBody"><tr><td colspan="8" class="empty">Loading examinations...</td></tr></tbody></table></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAoT3LGcdw3A0FzHDrPEuhTNCnfiTklGXY",authDomain:"ggchst-sms-new.firebaseapp.com",projectId:"ggchst-sms-new",storageBucket:"ggchst-sms-new.firebasestorage.app",messagingSenderId:"942770190211",appId:"1:942770190211:web:aa9a085a38aaa517b368b6"});const db=getFirestore(app);const $=id=>document.getElementById(id);let sessions=[],semesters=[],exams=[],editingId=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));const norm=v=>String(v??"").toLowerCase().trim();const info=(d,id)=>({id,...d});
function notice(m,type="success"){let n=$("notice");n.textContent=m;n.className="notice "+type;n.style.display="block";setTimeout(()=>n.style.display="none",3500)}
function render(){let s=$("session").value;$("session").innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");if(s)$("session").value=s;renderSem();$("filterSession").innerHTML='<option value="">All sessions</option>'+sessions.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");renderTable()}
function renderSem(){let sid=$("session").value,current=$("semester").value,a=semesters.filter(x=>!sid||x.sessionId===sid);$("semester").innerHTML='<option value="">Select semester</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.sessionName?" — "+esc(x.sessionName):""}</option>`).join("");$("semester").disabled=!sid;if(a.some(x=>x.id===current))$("semester").value=current;let fs=$("filterSemester").value,fsid=$("filterSession").value,b=semesters.filter(x=>!fsid||x.sessionId===fsid);$("filterSemester").innerHTML='<option value="">All semesters</option>'+b.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.sessionName?" — "+esc(x.sessionName):""}</option>`).join("");if(b.some(x=>x.id===fs))$("filterSemester").value=fs}
function badge(st){return `<span class="status status-${norm(st).replace(/\s+/g,'-')}">${esc(st)}</span>`}
function renderTable(){let q=norm($("search").value),sid=$("filterSession").value,sem=$("filterSemester").value,st=$("filterStatus").value;let a=exams.filter(x=>(!q||[x.name,x.sessionName,x.semesterName,x.type,x.status,x.notes].map(norm).join(" ").includes(q))&&(!sid||x.sessionId===sid)&&(!sem||x.semesterId===sem)&&(!st||x.status===st)).sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate)));$("tableBody").innerHTML=a.length?a.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.name)}</strong></td><td>${esc(x.sessionName)}</td><td>${esc(x.semesterName)}</td><td>${esc(x.type)}</td><td>${esc(x.startDate)} → ${esc(x.endDate)}</td><td>${badge(x.status)}</td><td><button class="small secondary" data-edit="${x.id}">Edit</button> <button class="small danger" data-delete="${x.id}">Delete</button></td></tr>`).join(""):'<tr><td colspan="8" class="empty">No examinations found.</td></tr>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
$("session").addEventListener("change",renderSem);$("filterSession").addEventListener("change",renderSem);["search","filterSemester","filterStatus"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",renderTable));
$("examForm").addEventListener("submit",async e=>{e.preventDefault();let s=sessions.find(x=>x.id===$("session").value),se=semesters.find(x=>x.id===$("semester").value),name=$("name").value.trim(),start=$("startDate").value,end=$("endDate").value;if(!s||!se)return notice("Please select the academic session and semester.","error");if(!name)return notice("Examination name is required.","error");if(end<start)return notice("End date cannot be earlier than start date.","error");let duplicate=exams.some(x=>x.id!==editingId&&x.sessionId===s.id&&x.semesterId===se.id&&norm(x.name)===norm(name));if(duplicate)return notice("An examination with this name already exists for the selected session and semester.","error");let data={sessionId:s.id,sessionName:s.name||"",semesterId:se.id,semesterName:se.name||"",name,type:$("type").value,startDate:start,endDate:end,status:$("status").value,notes:$("notes").value.trim(),updatedAt:serverTimestamp()};try{if(editingId)await updateDoc(doc(db,"examinations",editingId),data);else{data.createdAt=serverTimestamp();await addDoc(collection(db,"examinations"),data)}notice(editingId?"Examination updated successfully.":"Examination created successfully.");reset()}catch(err){console.error(err);notice("Unable to save examination: "+err.message,"error")}});
function edit(id){let x=exams.find(a=>a.id===id);if(!x)return;editingId=id;$("formTitle").textContent="Edit Examination";$("session").value=x.sessionId||"";renderSem();$("semester").value=x.semesterId||"";$("name").value=x.name||"";$("type").value=x.type||"";$("startDate").value=x.startDate||"";$("endDate").value=x.endDate||"";$("status").value=x.status||"Draft";$("notes").value=x.notes||"";$("cancelEdit").style.display="inline-block";scrollTo({top:0,behavior:"smooth"})}
function reset(){editingId=null;$("formTitle").textContent="Create Examination";$("examForm").reset();$("semester").disabled=true;$("semester").innerHTML='<option value="">Select semester</option>';$("status").value="Draft";$("cancelEdit").style.display="none"}$("cancelEdit").onclick=reset;
async function remove(id){let x=exams.find(a=>a.id===id);if(!x||!confirm(`Delete examination "${x.name}"? This does not automatically delete its schedules.`))return;try{await deleteDoc(doc(db,"examinations",id));notice("Examination deleted successfully.")}catch(err){notice("Unable to delete examination: "+err.message,"error")}}
function listen(name,fn){return onSnapshot(collection(db,name),s=>fn(s.docs.map(d=>info(d.data(),d.id))),err=>{console.error(name,err);notice("Unable to load "+name+".","error")})}
listen("academicSessions",a=>{sessions=a.sort((x,y)=>String(x.name).localeCompare(String(y.name)));render()});listen("semesters",a=>{semesters=a;renderSem()});listen("examinations",a=>{exams=a;renderTable()});
</script></body></html>
