<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Profile | GGCHST</title>
<style>:root{--g:#087443;--g2:#075c45;--bg:#f3f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#15352b}header{background:linear-gradient(135deg,#075c45,#087443);color:white;padding:18px}.head{max-width:1000px;margin:auto}header h1{font-size:20px;margin:0}header p{font-size:12px;margin:4px 0 0}main{max-width:1000px;margin:20px auto;padding:0 15px}.box{background:white;border:1px solid #dce9e3;border-radius:15px;padding:18px;margin-bottom:15px}.notice{background:#f8fcfa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:700;margin:5px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfded7;border-radius:9px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.photo{display:flex;gap:15px;align-items:center;margin-bottom:18px}.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#e7f4ee;border:3px solid #dce9e3}button{padding:11px 15px;border:0;border-radius:9px;background:var(--g);color:white;font-weight:800;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.secondary{background:#e8f0ed;color:#15352b}.msg{font-size:12px;margin-top:10px;color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="head"><h1>Green Garden College of Health Sciences &amp; Technology</h1><p>Student Portal • Profile Completion</p></div></header><main>
<section class="box notice"><h2>Complete Your Student Profile</h2><p>Please review and complete your information. Your profile must be completed before you continue.</p></section>
<section class="box"><form id="f"><div class="photo"><img id="preview" class="avatar" alt="Profile photo"><div><label>Profile Photo</label><input id="photoFile" type="file" accept="image/*"><small>Clear passport-style photo recommended.</small></div></div>
<div class="grid"><div><label>Student ID</label><input id="studentId" readonly></div><div><label>Email</label><input id="email" readonly></div><div><label>Full Name</label><input id="fullName" readonly></div><div><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div><div><label>Date of Birth</label><input id="dateOfBirth" type="date"></div><div><label>Phone</label><input id="phone"></div><div><label>Nationality</label><input id="nationality" value="Nigerian"></div><div><label>State of Origin</label><input id="stateOfOrigin"></div><div><label>LGA</label><input id="lga"></div><div><label>Guardian / Sponsor</label><input id="guardianName"></div><div><label>Guardian Phone</label><input id="guardianPhone"></div><div><label>Guardian Relationship</label><input id="guardianRelationship"></div><div class="full"><label>Address</label><textarea id="address"></textarea></div></div>
<div class="actions"><button type="button" class="secondary" id="logout">Sign Out</button><button id="save">Save &amp; Continue</button></div><div id="msg" class="msg"></div></form></section></main>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={
apiKey:"AIzaSyAoT3LGcdwA3FzHDrPEuhTNCnfiTklGXY",
authDomain:"ggchst-sms-new.firebaseapp.com",projectId:"ggchst-sms-new",
storageBucket:"ggchst-sms-new.firebasestorage.app",messagingSenderId:"942770190211",
appId:"1:942770190211:web:aa9a085a38aaa517b368b6"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let student=null,photo="";
async function find(u){const a=(await getDocs(collection(db,"students"))).docs.map(d=>({id:d.id,...d.data()}));return a.find(x=>String(x.studentUid||x.authUid||x.firebaseUid||x.uid||"")===u.uid)||a.find(x=>String(x.email||"").toLowerCase()===String(u.email||"").toLowerCase())}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,700/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};i.onerror=()=>rej(Error("Invalid image"));i.src=r.result};r.onerror=()=>rej(Error("Could not read image"));r.readAsDataURL(file)})}
onAuthStateChanged(auth,async u=>{if(!u){location.href="student-login.html";return}try{student=await find(u);if(!student){msg.textContent="No linked student record found.";return}studentId.value=student.studentId||student.id;email.value=student.email||u.email||"";fullName.value=student.fullName||student.name||"";["gender","dateOfBirth","phone","nationality","stateOfOrigin","lga","guardianName","guardianPhone","guardianRelationship","address"].forEach(k=>{if($(k))$(k).value=student[k]||""});photo=student.photo||student.photoURL||"";if(photo)preview.src=photo}catch(e){msg.textContent=e.message}});
photoFile.onchange=async e=>{try{photo=await compress(e.target.files[0]);preview.src=photo}catch(e){msg.textContent=e.message}};
f.onsubmit=async e=>{e.preventDefault();save.disabled=true;save.textContent="Saving…";try{await updateDoc(doc(db,"students",student.id),{gender:gender.value,dateOfBirth:dateOfBirth.value,phone:phone.value.trim(),nationality:nationality.value.trim(),stateOfOrigin:stateOfOrigin.value.trim(),lga:lga.value.trim(),guardianName:guardianName.value.trim(),guardianPhone:guardianPhone.value.trim(),guardianRelationship:guardianRelationship.value.trim(),address:address.value.trim(),photo,photoURL:photo,profileCompleted:true,profileCompletedAt:serverTimestamp(),lastProfileUpdateAt:serverTimestamp(),studentUid:auth.currentUser.uid,authUid:auth.currentUser.uid});location.href="student-dashboard.html"}catch(e){msg.textContent=e.message||"Could not save profile."}finally{save.disabled=false;save.textContent="Save & Continue"}};
logout.onclick=()=>signOut(auth);
</script></body></html>
