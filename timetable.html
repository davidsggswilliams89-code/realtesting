<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Timetable Management | GGCHST SMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}header{background:#0b5d3b;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}.header-inner{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;margin:0 0 5px}.subtitle{font-size:13px;opacity:.9}.container{max-width:1400px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.07);margin-bottom:20px}.card h2{margin:0 0 16px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #ccd5df;border-radius:9px;background:#fff;font-size:14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#0b5d3b;box-shadow:0 0 0 2px rgba(11,93,59,.1)}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.span2{grid-column:span 2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.primary{background:#0b5d3b;color:#fff}.secondary{background:#e9eef3;color:#172033}.danger{background:#b42318;color:#fff}.small{padding:7px 10px;font-size:12px}.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.status-active{background:#d9f5e5;color:#087443}.status-inactive{background:#eceff2;color:#59636e}.status-draft{background:#fff0c2;color:#795b00}.notice{padding:11px 13px;border-radius:9px;margin-bottom:14px;display:none;font-size:13px}.notice.success{background:#e0f7e9;color:#096b3b}.notice.error{background:#fde4e4;color:#9b1c1c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1200px}th,td{padding:11px 9px;border-bottom:1px solid #e7ebef;text-align:left;font-size:12px;vertical-align:middle}th{background:#f7f9fb;position:sticky;top:0;z-index:1}.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:15px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccd5df;border-radius:8px}.empty{text-align:center;padding:30px;color:#697586}.help{font-size:11px;color:#6b7280}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{grid-template-columns:1fr}header{position:static}}
</style></head><body>
<header><div class="header-inner"><div><h1>Timetable Management</h1><div class="subtitle">GGCHST School Management System • Academic timetable scheduling</div></div><a class="btn secondary" href="admin-fixed.html">← Admin</a></div></header>
<main class="container"><div id="notice" class="notice"></div>
<section class="card"><h2 id="formTitle">Create Timetable Entry</h2><form id="timetableForm"><div class="grid">
<div class="field"><label>Academic Session *</label><select id="session" required><option value="">Select session</option></select></div>
<div class="field"><label>Semester *</label><select id="semester" required disabled><option value="">Select semester</option></select></div>
<div class="field span2"><label>Course *</label><select id="course" required><option value="">Select course</option></select><div class="help">Loaded from the existing courses collection.</div></div>
<div class="field"><label>Lecturer</label><select id="lecturer"><option value="">Select lecturer</option></select></div>
<div class="field"><label>Day *</label><select id="day" required><option value="">Select day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div>
<div class="field"><label>Start Time *</label><select id="startTime" required></select></div>
<div class="field"><label>Stop Time *</label><select id="endTime" required></select></div>
<div class="field"><label>Venue</label><select id="venue"><option value="">Select venue</option></select></div>
<div class="field"><label>Class / Level</label><select id="level"><option value="">Select level</option></select></div>
<div class="field"><label>Department</label><select id="department"><option value="">Select department</option></select></div>
<div class="field"><label>Status *</label><select id="status" required><option>Active</option><option>Draft</option><option>Inactive</option></select></div>
<div class="field full"><label>Notes</label><textarea id="notes" placeholder="Optional timetable notes"></textarea></div></div>
<div class="actions"><button type="submit" class="primary">Save Timetable</button><button type="button" class="secondary" id="cancelEdit" style="display:none">Cancel Edit</button></div></form></section>
<section class="card"><h2>Timetable Entries</h2><div class="toolbar"><input id="search" type="search" placeholder="Search course, lecturer, venue, department..."><select id="filterSession"><option value="">All sessions</option></select><select id="filterSemester"><option value="">All semesters</option></select><select id="filterDay"><option value="">All days</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select><select id="filterStatus"><option value="">All status</option><option>Active</option><option>Draft</option><option>Inactive</option></select></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Session</th><th>Semester</th><th>Day</th><th>Time</th><th>Course</th><th>Department</th><th>Lecturer</th><th>Venue</th><th>Level</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tableBody"><tr><td colspan="12" class="empty">Loading timetable...</td></tr></tbody></table></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAoT3LGcdw3A0FzHDrPEuhTNCnfiTklGXY",authDomain:"ggchst-sms-new.firebaseapp.com",projectId:"ggchst-sms-new",storageBucket:"ggchst-sms-new.firebasestorage.app",messagingSenderId:"942770190211",appId:"1:942770190211:web:aa9a085a38aaa517b368b6"});const db=getFirestore(app);const $=id=>document.getElementById(id);
let sessions=[],semesters=[],courses=[],lecturers=[],venues=[],levels=[],departments=[],timetable=[],editingId=null;
const times=[["08:00","8:00 AM"],["09:00","9:00 AM"],["10:00","10:00 AM"],["11:00","11:00 AM"],["12:00","12:00 PM"],["13:00","1:00 PM"],["14:00","2:00 PM"],["15:00","3:00 PM"],["16:00","4:00 PM"],["17:00","5:00 PM"],["18:00","6:00 PM"]];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));const norm=v=>String(v??"").toLowerCase().trim();const info=(d,id)=>({id,...d});
function notice(m,type="success"){let n=$("notice");n.textContent=m;n.className="notice "+type;n.style.display="block";setTimeout(()=>n.style.display="none",3500)}
function timesFill(el,ph){$(el).innerHTML='<option value="">'+ph+'</option>'+times.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")};timesFill("startTime","Select start time");timesFill("endTime","Select stop time");
function course(d,id){return{id,code:d.courseCode||d.code||"",name:d.courseTitle||d.courseName||d.name||d.title||"",unit:d.courseUnit??d.creditUnit??d.unit??"",departmentId:d.departmentId||"",department:d.departmentName||d.department||"",levelId:d.levelId||"",level:d.levelName||d.level||"",status:d.status||"Active"}}
function lecturer(d,id){return{id,name:d.name||d.fullName||"",departmentId:d.departmentId||"",department:d.departmentName||d.department||"",status:d.status||"Active"}}
function venue(d,id){return{id,name:d.name||d.venueName||"",code:d.code||d.venueCode||"",type:d.type||d.venueType||"",departmentId:d.departmentId||"",department:d.departmentName||d.department||"",status:d.status||"Active"}}
function level(d,id){return{id,name:d.name||d.levelName||d.levelCode||"",code:d.code||d.levelCode||""}}
function dept(d,id){return{id,name:d.name||d.departmentName||"",code:d.code||d.departmentCode||"",status:d.status||"Active"}}
function render(){let s=$("session").value;$("session").innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");if(s)$("session").value=s;renderSem();$("filterSession").innerHTML='<option value="">All sessions</option>'+sessions.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");renderTable()}
function renderSem(){let sid=$("session").value,current=$("semester").value;let a=semesters.filter(x=>!sid||x.sessionId===sid);$("semester").innerHTML='<option value="">Select semester</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.sessionName?" — "+esc(x.sessionName):""}</option>`).join("");$("semester").disabled=!sid;if(a.some(x=>x.id===current))$("semester").value=current;let fs=$("filterSemester").value;let fsid=$("filterSession").value;let b=semesters.filter(x=>!fsid||x.sessionId===fsid);$("filterSemester").innerHTML='<option value="">All semesters</option>'+b.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.sessionName?" — "+esc(x.sessionName):""}</option>`).join("");if(b.some(x=>x.id===fs))$("filterSemester").value=fs}
function fill(id,arr,label){let c=$(id).value;$(id).innerHTML='<option value="">'+label+'</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.code?" — "+esc(x.code):""}</option>`).join("");if(c)$(id).value=c}
function renderLists(){let c=$("course").value;let a=courses.filter(x=>norm(x.status)!=="inactive").sort((a,b)=>(a.code+" "+a.name).localeCompare(b.code+" "+b.name));$("course").innerHTML='<option value="">Select course</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.code)} — ${esc(x.name)}${x.unit!==""?" ("+esc(x.unit)+" unit)":""}</option>`).join("");if(c)$("course").value=c;let l=lecturers.filter(x=>norm(x.status)!=="inactive").sort((a,b)=>a.name.localeCompare(b.name));$("lecturer").innerHTML='<option value="">Select lecturer</option>'+l.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.department?" — "+esc(x.department):""}</option>`).join("");let v=venues.filter(x=>norm(x.status)!=="inactive").sort((a,b)=>a.name.localeCompare(b.name));$("venue").innerHTML='<option value="">Select venue</option>'+v.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.code?" — "+esc(x.code):""}${x.type?" ("+esc(x.type)+")":""}</option>`).join("");fill("level",levels,"Select level");fill("department",departments.filter(x=>norm(x.status)!=="inactive"),"Select department")}
$("session").addEventListener("change",renderSem);$("filterSession").addEventListener("change",renderSem);$("course").addEventListener("change",()=>{let c=courses.find(x=>x.id===$("course").value);if(c){if(c.departmentId&&departments.some(x=>x.id===c.departmentId))$("department").value=c.departmentId;if(c.levelId&&levels.some(x=>x.id===c.levelId))$("level").value=c.levelId}});
["search","filterSemester","filterDay","filterStatus"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",renderTable));
function renderTable(){let q=norm($("search").value),sid=$("filterSession").value,sem=$("filterSemester").value,day=$("filterDay").value,st=$("filterStatus").value;let a=timetable.filter(x=>(!q||[x.courseCode,x.courseName,x.lecturerName,x.venue,x.department,x.level,x.day,x.notes].map(norm).join(" ").includes(q))&&(!sid||x.sessionId===sid)&&(!sem||x.semesterId===sem)&&(!day||x.day===day)&&(!st||x.status===st)).sort((a,b)=>["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].indexOf(a.day)-["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].indexOf(b.day)||String(a.startTime).localeCompare(String(b.startTime)));$("tableBody").innerHTML=a.length?a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.sessionName)}</td><td>${esc(x.semesterName)}</td><td>${esc(x.day)}</td><td>${esc(fmt(x.startTime))} – ${esc(fmt(x.endTime))}</td><td><strong>${esc(x.courseCode)}</strong><br>${esc(x.courseName)}</td><td>${esc(x.department)}</td><td>${esc(x.lecturerName||"—")}</td><td>${esc(x.venue||"—")}</td><td>${esc(x.level||"—")}</td><td><span class="status ${x.status==="Active"?"status-active":x.status==="Draft"?"status-draft":"status-inactive"}">${esc(x.status)}</span></td><td><button class="small secondary" data-edit="${x.id}">Edit</button> <button class="small danger" data-delete="${x.id}">Delete</button></td></tr>`).join(""):'<tr><td colspan="12" class="empty">No timetable entries found.</td></tr>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function fmt(v){let x=times.find(t=>t[0]===v);return x?x[1]:v||""}
function duplicate(d,ignore){return timetable.some(x=>x.id!==ignore&&x.sessionId===d.sessionId&&x.semesterId===d.semesterId&&x.day===d.day&&x.startTime===d.startTime&&x.endTime===d.endTime&&norm(x.venue)===norm(d.venue))}
$("timetableForm").addEventListener("submit",async e=>{e.preventDefault();let s=sessions.find(x=>x.id===$("session").value),se=semesters.find(x=>x.id===$("semester").value),c=courses.find(x=>x.id===$("course").value),l=lecturers.find(x=>x.id===$("lecturer").value),v=venues.find(x=>x.id===$("venue").value),lv=levels.find(x=>x.id===$("level").value),d=departments.find(x=>x.id===$("department").value);if(!s||!se||!c)return notice("Please select the academic session, semester and course.","error");if($("startTime").value>=$("endTime").value)return notice("Stop time must be later than start time.","error");let data={sessionId:s.id,sessionName:s.name||"",semesterId:se.id,semesterName:se.name||"",courseId:c.id,courseCode:c.code,courseName:c.name,courseUnit:c.unit,lecturerId:l?.id||"",lecturerName:l?.name||"",venueId:v?.id||"",venue:v?.name||"",departmentId:d?.id||c.departmentId||"",department:d?.name||c.department||"",levelId:lv?.id||c.levelId||"",level:lv?.name||c.level||"",day:$("day").value,startTime:$("startTime").value,endTime:$("endTime").value,status:$("status").value,notes:$("notes").value.trim(),updatedAt:serverTimestamp()};if(duplicate(data,editingId))return notice("A timetable entry already exists for this session, semester, day, time and venue.","error");try{if(editingId)await updateDoc(doc(db,"timetables",editingId),data);else{data.createdAt=serverTimestamp();await addDoc(collection(db,"timetables"),data)}notice(editingId?"Timetable entry updated successfully.":"Timetable entry created successfully.");reset()}catch(err){console.error(err);notice("Unable to save timetable entry: "+err.message,"error")}});
function edit(id){let x=timetable.find(a=>a.id===id);if(!x)return;editingId=id;$("formTitle").textContent="Edit Timetable Entry";$("session").value=x.sessionId||"";renderSem();$("semester").value=x.semesterId||"";$("course").value=x.courseId||"";$("lecturer").value=x.lecturerId||"";$("day").value=x.day||"";$("startTime").value=x.startTime||"";$("endTime").value=x.endTime||"";$("venue").value=x.venueId||"";$("level").value=x.levelId||"";$("department").value=x.departmentId||"";$("status").value=x.status||"Active";$("notes").value=x.notes||"";$("cancelEdit").style.display="inline-block";scrollTo({top:0,behavior:"smooth"})}
function reset(){editingId=null;$("formTitle").textContent="Create Timetable Entry";$("timetableForm").reset();$("semester").disabled=true;$("semester").innerHTML='<option value="">Select semester</option>';$("status").value="Active";$("cancelEdit").style.display="none"}$("cancelEdit").onclick=reset;
async function remove(id){let x=timetable.find(a=>a.id===id);if(!x||!confirm(`Delete timetable entry for ${x.courseCode||x.courseName} on ${x.day}?`))return;try{await deleteDoc(doc(db,"timetables",id));notice("Timetable entry deleted successfully.")}catch(err){notice("Unable to delete timetable entry: "+err.message,"error")}}
function listen(name,fn,err){return onSnapshot(collection(db,name),s=>fn(s.docs.map(d=>info(d.data(),d.id))),err)}
listen("academicSessions",a=>{sessions=a.sort((x,y)=>String(x.name).localeCompare(String(y.name)));render()});listen("semesters",a=>{semesters=a;renderSem()});listen("courses",a=>{courses=a.map(x=>course(x,x.id));renderLists()});listen("lecturers",a=>{lecturers=a.map(x=>lecturer(x,x.id));renderLists()});listen("venues",a=>{venues=a.map(x=>venue(x,x.id));renderLists()});listen("academicLevels",a=>{levels=a.map(x=>level(x,x.id));renderLists()});listen("departments",a=>{departments=a.map(x=>dept(x,x.id));renderLists()});listen("timetables",a=>{timetable=a;renderTable()});
</script></body></html>
